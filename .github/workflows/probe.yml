# WEGWERF — misst den Runner aus, bevor der echte Workflow gebaut wird.
#
# Runde 1 hat gezeigt: Bauen und Unit-Tests sind schnell, eine UI-Klasse mit
# zwei Klonen lief nach 28 Minuten immer noch. Verdacht: 7 GB RAM sind für zwei
# Klone zu wenig — lokal hat schon der vierte Klon auf 16 GB ausgelagert.
# Runde 2 misst deshalb dieselbe Klasse einmal mit einem und einmal mit zwei
# Klonen und schaut dabei auf die Auslagerung.
name: Probe

on:
  push:
    branches: [ci-suite]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        klone: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - name: Maschine
        run: |
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          sysctl vm.swapusage
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Schlüsseldatei aus der Vorlage
        run: cp ios/LeChariot/Resources/APIKeys.example.plist ios/LeChariot/Resources/APIKeys.plist

      - name: Bauen
        run: |
          start=$SECONDS
          xcodebuild build-for-testing \
            -project ios/LeChariot.xcodeproj -scheme LeChariot \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2' \
            -derivedDataPath build/tests-dd -quiet
          echo "::notice::BAUZEIT ${{ matrix.klone }} Klone: $((SECONDS - start)) s"
          du -sh build/tests-dd/Build/Products

      - name: Eine Klasse, ${{ matrix.klone }} Klon(e)
        run: |
          set +e
          xctestrun="$(ls -t build/tests-dd/Build/Products/*.xctestrun | head -1)"
          ( while true; do sysctl -n vm.swapusage; sleep 30; done ) > swap.log &
          wacht=$!
          start=$SECONDS
          xcodebuild test-without-building -xctestrun "$xctestrun" \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2' \
            -parallel-testing-enabled YES -parallel-testing-worker-count ${{ matrix.klone }} \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 240 \
            -only-testing:LeChariotUITests/OfferHitsJourneyTests 2>&1 | tee lauf.log
          dauer=$((SECONDS - start))
          kill $wacht 2>/dev/null
          echo "::notice::UIZEIT ${{ matrix.klone }} Klone: $dauer s"
          echo "--- je Test ---"
          grep -aoE "Test case '[A-Za-z0-9_.]+\(\)' (passed|failed) on '[^']*' \([0-9.]+ seconds\)" lauf.log | tail -20
          echo "--- Auslagerung, Höchstwert ---"
          sort -t= -k3 -rn swap.log | head -2
          echo "--- Startfehler? ---"
          grep -acE "Failed to launch|preflight|Timed out" lauf.log
