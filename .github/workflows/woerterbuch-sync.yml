# Das Wörterbuch liegt jetzt zweimal: gepflegt im Backend (`/pflegerunde`),
# mitgeliefert in der App, weil die Suche es zur Laufzeit braucht und offline
# funktionieren muss.
#
# Zwei Kopien laufen auseinander, und zwar still — die Suche würde einfach
# etwas weniger finden, ohne dass irgendwo etwas fehlschlägt. Genau die
# Fehlerklasse, die dieses Projekt schon dreimal getroffen hat. Deshalb ein
# Lauf, der laut wird.
#
# Der Auslöser ist absichtlich auch ein Zeitplan: Geändert wird das Wörterbuch
# **drüben** im Backend, und davon bekommt dieses Repo sonst nie etwas mit.
#
# Laut allein hat aber nicht gereicht: Die Pflegerunde vom 08.08. stand sechs
# Tage lang unnachgezogen da und hat jeden Push und jede Nacht rot gefärbt —
# 33 rote Läufe für eine Änderung, die eine Kopie weit weg war. Deshalb ist
# der Lauf ausserhalb eines PRs kein Melder mehr, sondern zieht selbst nach
# und öffnet den PR. Rot wird nur noch, wer die Datei hier von Hand anfasst.
name: Wörterbuch-Abgleich

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'ios/LeChariot/Resources/matching-woerterbuch.json'
      - '.github/workflows/woerterbuch-sync.yml'
  schedule:
    # Täglich 05:20 UTC, nach der Nightly des Backends.
    - cron: '20 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  MINE: ios/LeChariot/Resources/matching-woerterbuch.json
  QUELLE: https://raw.githubusercontent.com/Scxttk/lechariot-backend/master/docs/matching-woerterbuch.json
  ZWEIG: woerterbuch-nachziehen

jobs:
  abgleich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Wörterbuch aus dem Backend holen
        run: curl -sSf -o /tmp/backend.json "$QUELLE"

      # **Das Urteil bleibt der Byte-Vergleich**, denn mitgeliefert wird die
      # Datei, nicht ihr Inhalt. Die *Meldung* darf das nicht sein: Der Lauf
      # vom 12.08. hat 3853 Zeilen Rohdiff gehabt und vierzig davon gezeigt,
      # und die vierzig waren Umsortierung aus `#62`. Wer das liest, weiß
      # hinterher nicht, ob sieben Begriffe dazugekommen sind oder einer
      # verschwunden ist — und der rote Lauf stand vier Tage.
      #
      # Derselbe Bericht trägt jetzt auch den Rumpf des PRs — dort ist die
      # Frage dieselbe: was genau kommt da rein.
      - name: Vergleichen
        id: vergleich
        run: |
          if diff -q /tmp/backend.json "$MINE" >/dev/null; then
            echo "Wörterbuch ist synchron."
            echo "gleich=ja" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "gleich=nein" >> "$GITHUB_OUTPUT"
          python3 - "$MINE" > /tmp/bericht.txt <<'PY'
          import json, re, sys

          backend = json.load(open("/tmp/backend.json"))
          app = json.load(open(sys.argv[1]))

          def zeige(titel, zeilen):
              if zeilen:
                  print(f"{titel} ({len(zeilen)}):")
                  for zeile in zeilen:
                      print(f"    {zeile}")

          for feld in ("begriffe", "marken"):
              b, a = backend.get(feld, {}), app.get(feld, {})
              zeige(f"{feld}: im Backend neu", sorted(set(b) - set(a)))
              zeige(f"{feld}: nur in der App", sorted(set(a) - set(b)))
              zeige(f"{feld}: geändert", sorted(k for k in set(b) & set(a) if b[k] != a[k]))

          # Die Nonfood-Regeln sind ein Alternativ-Regex, kein Objekt — hier
          # zählt, welcher Ausdruck dazukam, nicht wo er steht.
          for feld in ("nonfood_terms", "nonfood_cat", "food_cat"):
              b, a = backend.get(feld, ""), app.get(feld, "")
              if b == a:
                  continue
              teile = lambda s: {t for t in re.split(r"\|", s) if t}
              zeige(f"{feld}: im Backend neu", sorted(teile(b) - teile(a)))
              zeige(f"{feld}: nur in der App", sorted(teile(a) - teile(b)))

          for feld in ("kategorien",):
              if backend.get(feld) != app.get(feld):
                  print(f"{feld}: unterschiedlich")
          PY
          cat /tmp/bericht.txt

      # Im PR wird nichts nachgezogen: Wer die Datei hier von Hand anfasst,
      # statt sie drüben zu pflegen, soll den roten Lauf sehen.
      - name: Abweichung im PR ist ein Fehler
        if: steps.vergleich.outputs.gleich == 'nein' && github.event_name == 'pull_request'
        run: |
          echo "::error::Das mitgelieferte Wörterbuch weicht vom Backend ab."
          echo "Die Suche der App findet damit andere Begriffe als der Import taggt."
          echo ""
          cat /tmp/bericht.txt
          echo ""
          echo "Gepflegt wird drüben im Backend (/pflegerunde). Von Hand nachziehen:"
          echo "  curl -sSf -o $MINE \\"
          echo "    $QUELLE"
          echo ""
          echo "Und danach die Suite: ein neuer Begriff braucht ein Artikelzeichen"
          echo "(ItemGlyphs.swift) und eine Regalzeile (MatchShelfTests.swift)."
          exit 1

      - name: Nachziehen und PR öffnen
        if: steps.vergleich.outputs.gleich == 'nein' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Steht der Zweig schon auf dem Stand des Backends, bleibt er liegen.
          # Sonst schöbe jeder Nachtlauf einen neuen Commit in einen offenen PR.
          #
          # Gelesen wird über FETCH_HEAD, nicht über `origin/$ZWEIG`:
          # actions/checkout setzt eine Refspec nur für den ausgecheckten Zweig,
          # ein Remote-Ref für $ZWEIG entsteht hier also nie.
          if git fetch -q origin "$ZWEIG" 2>/dev/null \
             && git show "FETCH_HEAD:$MINE" 2>/dev/null | diff -q - /tmp/backend.json >/dev/null; then
            echo "Zweig $ZWEIG steht bereits auf dem Stand des Backends."
            gh pr list --head "$ZWEIG" --state open
            exit 0
          fi

          cp /tmp/backend.json "$MINE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$ZWEIG"
          git add "$MINE"
          git commit -m "Wörterbuch aus dem Backend nachziehen"
          git push --force origin "$ZWEIG"

          if [ -n "$(gh pr list --head "$ZWEIG" --state open --json number --jq '.[].number')" ]; then
            echo "PR steht schon offen und zeigt jetzt den neuen Stand."
            exit 0
          fi

          {
            echo "Das Wörterbuch wurde drüben im Backend gepflegt (\`/pflegerunde\`)."
            echo "Dieser PR zieht die mitgelieferte Kopie nach, damit die Suche der App"
            echo "dieselben Begriffe findet, die der Import taggt."
            echo ""
            echo '```'
            cat /tmp/bericht.txt
            echo '```'
            echo ""
            echo "Vor dem Merge: ein neuer Begriff braucht ein Artikelzeichen"
            echo "(\`ItemGlyphs.swift\`) und eine Regalzeile (\`MatchShelfTests.swift\`) —"
            echo "die Suite sagt, ob beides steht."
            echo ""
            echo "Geöffnet von \`woerterbuch-sync.yml\`."
          } > /tmp/rumpf.md

          gh pr create \
            --base main --head "$ZWEIG" \
            --title "Wörterbuch aus dem Backend nachziehen" \
            --body-file /tmp/rumpf.md
