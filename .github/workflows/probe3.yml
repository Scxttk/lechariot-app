# WEGWERF — Runde 5.
#
# Stand: Bauen 52–63 s, Unit-Tests 3:33, Simulator bootet in 1:26. Offen ist
# nur noch, was eine Journey auf diesem Runner kostet — und ob Klone dort etwas
# bringen oder schaden (3 Kerne, 7 GB; lokal hat schon der vierte Klon auf
# 16 GB ausgelagert).
#
# Runde 4 war ein Eigentor: `timeout` gibt es auf macOS nicht, der Schritt war
# nach 0 s „grün". Der Deckel sitzt jetzt da, wo er hingehört —
# `timeout-minutes` am Schritt.
name: Probe3

on:
  push:
    branches: [ci-suite]
    paths: ['.github/workflows/probe3.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - klone: 'NO'
            arg: '-parallel-testing-enabled NO'
          - klone: '2'
            arg: '-parallel-testing-enabled YES -parallel-testing-worker-count 2'
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          cp ios/LeChariot/Resources/APIKeys.example.plist ios/LeChariot/Resources/APIKeys.plist

      - name: Bauen
        run: |
          xcodebuild build-for-testing \
            -project ios/LeChariot.xcodeproj -scheme LeChariot \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2' \
            -derivedDataPath build/tests-dd -quiet

      - name: Eine Klasse, Klone=${{ matrix.klone }}
        timeout-minutes: 25
        run: |
          set +e
          xctestrun="$(ls -t build/tests-dd/Build/Products/*.xctestrun | head -1)"
          start=$SECONDS
          xcodebuild test-without-building -xctestrun "$xctestrun" \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2' \
            ${{ matrix.arg }} \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 300 \
            -only-testing:LeChariotUITests/OfferHitsJourneyTests 2>&1 | tee lauf.log
          echo "::notice::KLASSENZEIT Klone=${{ matrix.klone }}: $((SECONDS - start)) s"
          echo "--- je Test ---"
          grep -aoE "[Tt]est [Cc]ase '[^']+' (passed|failed)[^(]*\([0-9.]+ seconds\)" lauf.log | tail -20
          echo "--- Auslagerung ---"
          sysctl vm.swapusage
          echo "--- Symptome ---"
          grep -aoE "Timed out while [a-zA-Z ]+|Failed to launch|preflight checks|to idle|Unknown application" lauf.log | sort | uniq -c | sort -rn | head
