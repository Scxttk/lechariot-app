# WEGWERF — Runde 6.
#
# Runde 5 hat die eigentliche Frage beantwortet, nur anders als erwartet: Die
# Journeys sind auf dem Runner nicht bloss langsam, sie sind **rot**. Alle drei
# Tests von `OfferHitsJourneyTests` fallen an derselben Zeile (`:40`), und der
# Barrierefreiheits-Baum sagt, warum: Die Plan-Karte steht da und meldet „NOCH
# KEIN TREFFER — Für deine Liste gibt es diese Woche keine Angebote in deinen
# Filialen." Die Artikel sind also angelegt, es passt nur nichts dazu.
#
# Verdacht: Der Simulator des Runners ist frisch und damit englisch/US, Scotts
# ist deutsch. Getestet wird das mit `-testLanguage de -testRegion DE` gegen
# einen Kontrolllauf ohne — dieselbe Klasse, sonst nichts geändert.
#
# Nebenbefund aus Runde 5, schon verwertet: **Klone schaden hier.**
# 3 Tests ohne Klone 417 s, mit zwei Klonen 508 s, und nur mit Klonen taucht
# Auslagerung auf (480 MB gegen 0).
name: Probe3

on:
  push:
    branches: [ci-suite]
    paths: ['.github/workflows/probe3.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - sprache: 'de-DE'
            arg: '-testLanguage de -testRegion DE'
          - sprache: 'Vorgabe'
            arg: ''
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          cp ios/LeChariot/Resources/APIKeys.example.plist ios/LeChariot/Resources/APIKeys.plist

      - name: Bauen
        run: |
          xcodebuild build-for-testing \
            -project ios/LeChariot.xcodeproj -scheme LeChariot \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2' \
            -derivedDataPath build/tests-dd -quiet

      - name: Eine Klasse, Sprache=${{ matrix.sprache }}
        timeout-minutes: 25
        run: |
          set +e
          xctestrun="$(ls -t build/tests-dd/Build/Products/*.xctestrun | head -1)"
          start=$SECONDS
          xcodebuild test-without-building -xctestrun "$xctestrun" \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2' \
            -parallel-testing-enabled NO ${{ matrix.arg }} \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 300 \
            -only-testing:LeChariotUITests/OfferHitsJourneyTests 2>&1 | tee lauf.log
          echo "::notice::Sprache=${{ matrix.sprache }}: $((SECONDS - start)) s"
          grep -aE "^Test Case .*(passed|failed)|Executed [0-9]+ test" lauf.log | tail -6
          echo "--- Plan-Überschrift, wie die App sie meldet ---"
          grep -ao "identifier: 'list.plan.headline', label: '[^']*'" lauf.log | sort -u | head -3
