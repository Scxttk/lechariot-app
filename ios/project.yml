name: Smartshop
options:
  bundleIdPrefix: com.skoehler
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 3DZ9T8SGX5
targets:
  Smartshop:
    type: application
    platform: iOS
    sources:
      - path: Smartshop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skoehler.smartshop
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Dein Standort wird einmalig verwendet, um deine Postleitzahl zu ermitteln. Du kannst sie auch manuell eingeben."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # iPad may rotate; the iPhone stays portrait — a one-handed shopping
        # list has nothing to gain from landscape.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SmartshopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SmartshopTests
    dependencies:
      - target: Smartshop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skoehler.smartshopTests
        GENERATE_INFOPLIST_FILE: true
  SmartshopUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SmartshopUITests
    dependencies:
      - target: Smartshop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skoehler.smartshopUITests
        GENERATE_INFOPLIST_FILE: true
schemes:
  Smartshop:
    build:
      targets:
        Smartshop: all
        SmartshopTests: [test]
        SmartshopUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SmartshopTests
        - SmartshopUITests
