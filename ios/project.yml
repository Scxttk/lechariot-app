name: Smartshop
options:
  bundleIdPrefix: com.skoehler
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 3DZ9T8SGX5
targets:
  Smartshop:
    type: application
    platform: iOS
    sources:
      - path: Smartshop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skoehler.smartshop
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        TARGETED_DEVICE_FAMILY: "1"
  SmartshopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SmartshopTests
    dependencies:
      - target: Smartshop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skoehler.smartshopTests
        GENERATE_INFOPLIST_FILE: true
schemes:
  Smartshop:
    build:
      targets:
        Smartshop: all
        SmartshopTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SmartshopTests
