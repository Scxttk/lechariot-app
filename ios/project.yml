name: LeChariot
options:
  bundleIdPrefix: com.skoehler
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 3DZ9T8SGX5
targets:
  LeChariot:
    type: application
    platform: iOS
    sources:
      - path: LeChariot
        # Die Vorlage gehört ins Repo, aber nicht in die App: sie landete sonst
        # als APIKeys.example.plist im Bundle jedes Testers.
        excludes:
          - Resources/APIKeys.example.plist
          - Resources/APIKeys.plist
      # Benannt statt eingesammelt, weil die Datei gitignoriert ist: Der
      # Sammelschritt erzeugte auf einer Maschine mit Schlüsseln eine andere
      # `project.pbxproj` als auf einer ohne, und `release.sh` lehnt danach
      # seinen eigenen schmutzigen Baum ab. `optional` heißt nur „beim Erzeugen
      # nicht meckern"; gebaut wird weiter mit der Datei (README, Schritt 2).
      - path: LeChariot/Resources/APIKeys.plist
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skoehler.lechariot
        GENERATE_INFOPLIST_FILE: true
        # Die App verschlüsselt nichts selbst, sie redet nur per HTTPS mit
        # Supabase — damit greift die Standardausnahme. Ohne diesen Eintrag
        # fragt App Store Connect die Exportbestimmungen bei *jedem* Build
        # einzeln ab und der Build bleibt bis dahin für Tester gesperrt.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        # Der Zielname trägt kein Leerzeichen (Modul, Schema, Ordner), der
        # Homescreen soll aber "Le Chariot" zeigen — das ist der Markenname.
        INFOPLIST_KEY_CFBundleDisplayName: "Le Chariot"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        # **Ohne das blitzt jeder Kaltstart weiss auf** (06.08. gefunden). Ein
        # leerer `UILaunchScreen` heisst `systemBackground` — reinweiss im
        # hellen, reinschwarz im dunklen Modus. Danach malt die App
        # `Theme.background` (#EDE9C0 / #1A1F15). Jeder Start war also
        # weiss -> creme bzw. schwarz -> oliv.
        #
        # Das Farbset traegt exakt die Werte aus `Theme.background`; ein Test
        # haelt beide zusammen, sonst driften sie beim naechsten Farbdreh.
        #
        # Achtung beim Pruefen: iOS legt den gerenderten Startbildschirm je
        # App-Version ab. Nach dieser Aenderung zeigt ein Geraet unter Umstaenden
        # weiter den alten, bis die App neu installiert oder die Version
        # angehoben wird. Nicht eine Stunde lang debuggen.
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: LaunchBackground
        # Der Text nennt beide Zwecke, seit die Entfernungen im Filial-Picker
        # ab dem Standort gemessen werden — vorher stand hier "einmalig, um
        # deine Postleitzahl zu ermitteln", und das stimmte dann nicht mehr.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Dein Standort wird verwendet, um deine Postleitzahl zu ermitteln und die Entfernung zu den Filialen zu berechnen. Beides geht auch ohne — die PLZ kannst du eingeben, die Entfernungen rechnen wir dann ab deren Mitte."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # iPad may rotate; the iPhone stays portrait — a one-handed shopping
        # list has nothing to gain from landscape.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LeChariotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LeChariotTests
    dependencies:
      - target: LeChariot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skoehler.lechariotTests
        GENERATE_INFOPLIST_FILE: true
  LeChariotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LeChariotUITests
    dependencies:
      - target: LeChariot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skoehler.lechariotUITests
        GENERATE_INFOPLIST_FILE: true
schemes:
  LeChariot:
    build:
      targets:
        LeChariot: all
        LeChariotTests: [test]
        LeChariotUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LeChariotTests
        - LeChariotUITests
