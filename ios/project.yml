name: LeChariot
options:
  bundleIdPrefix: com.skoehler
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 3DZ9T8SGX5
targets:
  LeChariot:
    type: application
    platform: iOS
    sources:
      - path: LeChariot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skoehler.lechariot
        GENERATE_INFOPLIST_FILE: true
        # Der Zielname trägt kein Leerzeichen (Modul, Schema, Ordner), der
        # Homescreen soll aber "Le Chariot" zeigen — das ist der Markenname.
        INFOPLIST_KEY_CFBundleDisplayName: "Le Chariot"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Dein Standort wird einmalig verwendet, um deine Postleitzahl zu ermitteln. Du kannst sie auch manuell eingeben."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # iPad may rotate; the iPhone stays portrait — a one-handed shopping
        # list has nothing to gain from landscape.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LeChariotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LeChariotTests
    dependencies:
      - target: LeChariot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skoehler.lechariotTests
        GENERATE_INFOPLIST_FILE: true
  LeChariotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LeChariotUITests
    dependencies:
      - target: LeChariot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skoehler.lechariotUITests
        GENERATE_INFOPLIST_FILE: true
schemes:
  LeChariot:
    build:
      targets:
        LeChariot: all
        LeChariotTests: [test]
        LeChariotUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LeChariotTests
        - LeChariotUITests
